name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: requirements_test.txt
          # Wheels differ per Python version; without a suffix both matrix
          # jobs would race to save under the same key.
          cache-suffix: py${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install --system -r requirements_test.txt

      - name: Run tests with coverage
        run: |
          set +e
          pytest tests/ \
            --cov=custom_components.elnur_gabarron \
            --cov-report=term-missing \
            --cov-report=xml \
            2>&1 | tee pytest_output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          # Check if tests passed despite cleanup error
          if [ $EXIT_CODE -eq 1 ]; then
            if grep -E "[0-9]+ passed" pytest_output.txt && ! grep -E "[0-9]+ failed" pytest_output.txt; then
              echo "✅ All tests passed (ignoring known thread cleanup warning)"
              exit 0
            fi
          fi
          exit $EXIT_CODE

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
