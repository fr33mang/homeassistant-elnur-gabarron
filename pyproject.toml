[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly rather than relying on ruff's defaults, which have grown
# beyond this between releases: pyflakes, the uncontroversial pycodestyle
# errors, and import sorting -- what black + isort covered before.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = [".git"]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["custom_components.elnur_gabarron"]
omit = [
    "tests/*",
    "venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
