[tool.ruff]
line-length = 120
# The oldest Python the code must still run on, not the one CI tests (3.14).
# At py314 ruff-format rewrites `except (A, B):` to the 3.14-only unparenthesized
# form, which would stop the integration loading on a Python 3.13 install.
target-version = "py313"

[tool.ruff.lint]
# What black + isort covered before: pyflakes, the uncontroversial pycodestyle
# errors, and import sorting. Listed explicitly so the switch to ruff doesn't
# also change lint policy -- ruff's own defaults include more (UP, BLE, SIM...),
# which would be worth adopting on purpose rather than by accident.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = [".git"]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["custom_components.elnur_gabarron"]
omit = [
    "tests/*",
    "venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
